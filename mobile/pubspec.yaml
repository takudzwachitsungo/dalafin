name: dalafin
description: "Dalafin: Financial Discipline Companion & Wealth Trainer for Everyday People"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.2
  dio: ^5.4.3
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "../icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
